<style>
  :root {
    --bg:#04070f; --cy:#22d3ee; --bl:#3b82f6; --pu:#a855f7; --pk:#ec4899;
    --txt:#e6edff; --sub:#8b9bc4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--txt); overflow:hidden;
    font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  /* ambient glows */
  .glow { position:absolute; border-radius:50%; filter:blur(90px); opacity:.5; pointer-events:none; }
  .g1 { width:55vw; height:55vw; background:radial-gradient(circle,#0ea5e9,transparent 65%); top:-18vw; left:-12vw; animation:drift 14s ease-in-out infinite alternate; }
  .g2 { width:50vw; height:50vw; background:radial-gradient(circle,#7c3aed,transparent 65%); bottom:-20vw; right:-10vw; animation:drift 17s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(4vw,3vh) scale(1.12)} }
  /* starfield */
  .star { position:absolute; width:3px; height:3px; border-radius:50%; background:#cfe6ff; opacity:.35; animation:tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100%{opacity:.12} 50%{opacity:.7} }
  /* card */
  .card {
    position:relative; z-index:2; text-align:center; padding:56px 64px 48px;
    background:rgba(10,16,34,.62); border:1px solid rgba(120,150,255,.16);
    border-radius:28px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    max-width:520px; width:calc(100% - 40px);
    animation:pop .7s cubic-bezier(.2,1.2,.3,1) both;
  }
  @keyframes pop { from{opacity:0; transform:translateY(24px) scale(.96)} to{opacity:1; transform:none} }
  .logo { width:104px; height:104px; filter:drop-shadow(0 0 26px rgba(56,189,248,.55)); animation:bounce 2.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  h1 { font-size:26px; font-weight:800; letter-spacing:.5px; margin:22px 0 8px;
    background:linear-gradient(90deg,var(--cy),var(--bl),var(--pu),var(--pk));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    background-size:220% 100%; animation:shim 5s linear infinite; }
  @keyframes shim { to{background-position:220% 0} }
  .desc { color:var(--sub); font-size:14px; line-height:1.7; }
  .desc b { color:#c7d6ff; font-weight:600; }
  /* progress ring */
  .ringwrap { position:relative; width:74px; height:74px; margin:30px auto 6px; }
  .ringwrap svg { transform:rotate(-90deg); }
  .track { stroke:rgba(130,160,255,.14); }
  .bar { stroke:url(#grad); stroke-linecap:round; transition:stroke-dashoffset .1s linear; filter:drop-shadow(0 0 6px rgba(56,189,248,.8)); }
  .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:800; color:#dbe7ff; font-variant-numeric:tabular-nums; }
  .hint { font-size:12.5px; color:var(--sub); margin-top:14px; }
  /* buttons */
  .btns { display:flex; gap:14px; justify-content:center; margin-top:26px; flex-wrap:wrap; }
  .btn { border:none; cursor:pointer; font-size:15px; font-weight:700; padding:13px 30px; border-radius:14px; letter-spacing:.4px; transition:transform .18s ease, box-shadow .18s ease, opacity .18s; }
  .btn:active { transform:scale(.96); }
  .primary { color:#fff; background:linear-gradient(120deg,var(--cy),var(--bl) 45%,var(--pu));
    box-shadow:0 8px 28px rgba(59,130,246,.45); }
  .primary:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(139,92,246,.55); }
  .ghost { color:#c3d2ff; background:rgba(120,150,255,.08); border:1px solid rgba(130,160,255,.22); }
  .ghost:hover { background:rgba(120,150,255,.16); transform:translateY(-2px); }
  .foot { margin-top:26px; font-size:11.5px; color:#5c6b94; letter-spacing:.4px; }

<script>
  var TARGET = "https://start.xCrossSwap.com";
  var TOTAL = 3000, start = null, done = false;

  /* starfield */
  (function () {
    var box = document.getElementById('stars');
    for (var i = 0; i < 70; i++) {
      var s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top  = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.transform = 'scale(' + (0.4 + Math.random()) + ')';
      box.appendChild(s);
    }
  })();

  var bar = document.getElementById('bar'), num = document.getElementById('num');
  function tick(ts) {
    if (done) return;
    if (!start) start = ts;
    var p = Math.min((ts - start) / TOTAL, 1);
    bar.style.strokeDashoffset = 194.8 * (1 - p);
    num.textContent = Math.ceil((TOTAL - (ts - start)) / 1000);
    if (p >= 1) go(); else requestAnimationFrame(tick);
  }
  function go()   { if (done) return; done = true; window.location.href = TARGET; }
  function back() { done = true; if (history.length > 1) history.back(); else window.location.href = "https://xcrossswap.com"; }
  requestAnimationFrame(tick);
</script>
